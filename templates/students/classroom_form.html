{% extends 'base/layout.html' %}
{% block title %}{{ action }} Grupo{% endblock %}
{% block page_title %}{{ action }} Grupo{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <h1>{{ action }} Grupo</h1>
    <p>Organiza tus estudiantes en grupos o salones</p>
  </div>
  <a href="{% url 'students:classrooms' %}" class="btn-outline">
    <i class="bi bi-arrow-left"></i> Volver
  </a>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="card">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Nombre del grupo *</label>
          <input type="text" name="name" class="form-control" placeholder="Ej: 5° A, Grado 3, Sala Azul..." required>
        </div>
        <div class="form-group">
          <label class="form-label">Nivel / Grado</label>
          <input type="text" name="grade_level" class="form-control" placeholder="Ej: Primaria, 5°, Secundaria...">
        </div>
        <div class="form-group">
          <label class="form-label">Materia</label>
          <input type="text" name="subject" class="form-control" placeholder="Ej: Matemáticas, Español...">
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn-primary">
            <i class="bi bi-check2-circle"></i> {{ action }} grupo
          </button>
          <a href="{% url 'students:classrooms' %}" class="btn-outline">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
